context: |
  Project: NeoFlow document processing and template management.
  Tech stack: FastAPI Python backend, React/TypeScript frontend, Supabase storage/database, Feishu Bitable push integration.
  Domain: Admin users configure document extraction templates. End users upload documents/images for OCR/VLM extraction, review extracted fields, and push structured results to Feishu.
  Convention: Keep requirements changes in openspec/changes/<change-id>. Use Chinese for product-facing rationale and scenarios when the surrounding task is Chinese.

